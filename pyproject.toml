[project]
name = "traffic-management-system"
version = "0.1.0"
description = "AI-based smart traffic monitoring and management system"
requires-python = ">=3.9"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
pythonpath = [
    "packages/shared",
    "packages/adaptive-policy",
    "packages/sumo-engine",
    "packages/cv-pipeline",
    "backend",
]
testpaths = [
    "packages/adaptive-policy/tests",
    "backend/smoke_tests",
]
